name: v0-panel
label: V0 Panel
description: Vercel v0-inspired neutral workspace — Geist typography, quiet surfaces, hairline borders, and restrained blue focus.

palette:
  background:
    hex: "#fafafa"
    alpha: 1
  midground:
    hex: "#18181b"
    alpha: 1
  foreground:
    hex: "#ffffff"
    alpha: 0
  warmGlow: "rgba(255, 255, 255, 0)"
  noiseOpacity: 0

typography:
  fontSans: '"Geist", "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
  fontMono: '"Geist Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace'
  fontDisplay: '"Geist", "Inter", ui-sans-serif, system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
  baseSize: "15px"
  lineHeight: "1.5"
  letterSpacing: "-0.01em"

layout:
  radius: "0.5rem"
  density: comfortable
layoutVariant: standard

componentStyles:
  card:
    background: "#ffffff"
    border: "1px solid #e4e4e7"
    boxShadow: "none"
  header:
    background: "rgba(250, 250, 250, 0.92)"
    borderBottom: "1px solid #e4e4e7"
    boxShadow: "none"
  sidebar:
    background: "#ffffff"
    borderRight: "1px solid #e4e4e7"
  footer:
    background: "#fafafa"
    borderTop: "1px solid #e4e4e7"
  page:
    background: "#fafafa"
  tab:
    background: "transparent"
    boxShadow: "none"
  badge:
    background: "#f4f4f5"
    boxShadow: "none"

colorOverrides:
  card: "#ffffff"
  cardForeground: "#18181b"
  popover: "#ffffff"
  popoverForeground: "#18181b"
  primary: "#18181b"
  primaryForeground: "#ffffff"
  secondary: "#f4f4f5"
  secondaryForeground: "#27272a"
  muted: "#f4f4f5"
  mutedForeground: "#71717a"
  accent: "#f4f4f5"
  accentForeground: "#18181b"
  destructive: "#dc2626"
  destructiveForeground: "#ffffff"
  success: "#16a34a"
  warning: "#d97706"
  border: "#e4e4e7"
  input: "#e4e4e7"
  ring: "#2563eb"

customCSS: |
  /* V0/Vercel-like visual reset: quiet, documentation-grade UI. */
  *, *::before, *::after {
    box-shadow: none !important;
  }

  html, body,
  *:not(code):not(pre):not(kbd):not(.font-mono):not(.xterm):not(.xterm *) {
    font-family: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
  }

  code, pre, kbd, .font-mono, .font-mono-ui {
    font-family: "Geist Mono", "SFMono-Regular", Consolas, monospace !important;
  }

  body {
    background: #fafafa !important;
    color: #18181b !important;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Remove the dashboard's decorative treatment without changing content. */
  .uppercase, [class*="uppercase"] {
    text-transform: none !important;
    letter-spacing: -0.01em !important;
  }

  button, input, textarea, select, [role="button"] {
    border-radius: 6px !important;
    box-shadow: none !important;
    font-weight: 500 !important;
  }

  input, textarea, select {
    background: #ffffff !important;
    border-color: #e4e4e7 !important;
  }

  button:focus-visible, input:focus-visible, textarea:focus-visible,
  select:focus-visible, [role="button"]:focus-visible {
    outline: 2px solid #2563eb !important;
    outline-offset: 2px !important;
  }

  a {
    color: #2563eb;
  }

  [data-radix-popper-content-wrapper], [role="dialog"], [role="menu"] {
    border: 1px solid #e4e4e7 !important;
    box-shadow: 0 8px 24px rgba(24, 24, 27, 0.08) !important;
  }

  /* White menu rail with neutral black navigation text. */
  #app-sidebar {
    background: #ffffff !important;
    border-color: #e4e4e7 !important;
    color: #18181b !important;
  }
  #app-sidebar a { color: #3f3f46 !important; }
  #app-sidebar a:hover, #app-sidebar a[aria-current="page"] { color: #000000 !important; }

  /* Neutralize the source's overly wide tracking utilities everywhere. */
  #root [class~="tracking-[0.2em]"],
  #root [class~="tracking-[0.1875rem]"] { letter-spacing: normal !important; }

  /* Tab switcher: no outer border and no divider between radio-tab buttons. */
  #root :has(> button[role="radio"]) { border: none !important; }
  #root button[role="radio"] { border-right: none !important; }

  /* New chat: quiet secondary action using this theme's muted gray. */
  #root button:has(> .arc-border):has(.lucide-message-square-plus) {
    background: #e4e4e7 !important;
  }
  #root button:has(> .arc-border):has(.lucide-message-square-plus):hover {
    background: #d4d4d8 !important;
  }
